name: Build PDF Report

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Chinese Fonts and Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-lang-chinese fonts-noto-cjk

      - name: Build PDF
        run: |
          pandoc report.md -o Lab0-姓名-学号.pdf \
            --pdf-engine=xelatex \
            -V CJKmainfont="Noto Sans CJK SC" \
            -V mainfont="Noto Sans CJK SC" \
            -V monofont="Noto Sans Mono CJK SC" \
            --highlight-style=tango \
            --toc \
            -V colorlinks=true \
            -V linkcolor=blue

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: Lab0-PDF
          path: Lab0-姓名-学号.pdf
